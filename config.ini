; OrthoParity data pipeline settings. Edit values after the "=" sign. Lines starting with ";" are comments.
; Every input file name and expected row count lives here and nowhere else.

[settings]
; How many generations of predicates to follow from a device.
MAX_GENERATIONS = 10
; Pilot known cases (comma separated).
PILOT_KNOWN_CASES = K241487, K261809
; Random seed for the pilot sample (change it to draw a different sample).
PILOT_SEED = 20261116
; Devices drawn per pilot stratum.
PILOT_PER_STRATUM = 20
; Walk ancestor chains for pilot devices (yes/no) and stop after this many documents.
PILOT_WALK_CHAINS = yes
PILOT_MAX_CHAIN_DOCS = 2500
; Clearances with no summary online (approved at Gate 1, 2026-11-16, from the pilot: 0 of 27 pre-1991 blanks
; and 0 of 17 clearances from 1991-1995 had a Summary PDF).
; PRE1991_BLANK_RULE: blank STATEORSUMM, decided 1990 or earlier. stop = "No summary on file (pre-1991)", no request.
PRE1991_BLANK_RULE = stop
; EARLY1990S_RULE: STATEORSUMM Summary or blank, decided 1991-1995. stop = "No summary on file (1991-1995)", no request.
EARLY1990S_RULE = stop
; Which flags keep a document out of CLEAN (approved at Gate 1: C).
; C = "PMA predicate" never blocks; "mentioned, not classified" blocks only when the document has no HIGH predicate
;     from a labeled section. strict = every flag blocks.
; D = common-sense rules set by the project owner on 2026-11-17 (current setting):
;     1. a predicate named without an FDA number is ignored (no review);
;     2. the FDA number decides identity, so name mismatches never block (products get renamed);
;     3. any other K-number (or DEN) in the Summary is a predicate, even when not labeled one.
;     Review is kept only for a number not found in any FDA source, a number read by OCR or a repaired font that
;     matches neither the FDA device name nor the company, and a PDF that belongs to another number.
REVIEW_RULE = D
; Number of pilot devices for the hand-check workbook.
HANDCHECK_SAMPLE = 40

[network]
; One request per second at most, across every FDA host.
REQUESTS_PER_SECOND = 1
MAX_RETRIES = 3
BACKOFF_SECONDS = 5
TIMEOUT_SECONDS = 60
USER_AGENT = OrthoParity/0.4 (+https://www.orthoparity.com; open-source 510(k) predicate research tool; polite crawler, 1 request per second)
; detail_first = read the FDA clearance detail page for the Summary link, then fall back to the URL pattern.
; pattern_first = try the URL pattern first, then the detail page (half the requests). Approved at Gate 1:
; 1,655 of 1,656 pilot detail-page links matched the pattern's first guess.
PDF_URL_STRATEGY = pattern_first
DETAIL_PAGE_URL = https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpmn/pmn.cfm?ID={knumber}
PDF_URL_PATTERN = https://www.accessdata.fda.gov/cdrh_docs/{folder}/{knumber}.pdf
OPENFDA_URL = https://api.fda.gov/device/510k.json
USE_OPENFDA = yes

[ocr]
; yes = use Tesseract when a PDF has no text layer (only if Tesseract is installed).
USE_OCR = yes
; Leave blank to find Tesseract automatically. Windows example: C:\Program Files\Tesseract-OCR\tesseract.exe
TESSERACT_PATH =
OCR_DPI = 200
OCR_MAX_PAGES = 15
; Tesseract page-layout mode. 4 reads boxed eSTAR form rows. Mode 6 is retried automatically when a
; predicate heading was read but no predicate number.
OCR_PSM = 4

[paths]
; Folder holding the input files, relative to this folder.
INPUT_DIR = ../FDA 510K Clearances for Orthopedics
DATA_DIR = data
; Human review decisions (vendor registry, product dictionary, predicate review). Published with the code.
REVIEW_DIR = reviews
OUTPUT_DIR = outputs
; The CSV files the website's database imports (one per Supabase table).
SITE_DATA_DIR = outputs/site_data
LOG_DIR = logs
CACHE_DIR = cache/pdfs
DETAIL_CACHE_DIR = cache/detail_pages
; OCR text is cached here (keyed by PDF hash and OCR settings) so re-parsing never OCRs a page twice.
OCR_CACHE_DIR = cache/ocr_text
DB_FILE = data/predicate_chain.db
; Optional: another copy of this project whose cache/pdfs can be reused (copied, never modified). Ignored if missing.
OLD_PROJECT_DIR = ../predicate-chain_old

[inputs]
STARTING_SET_FILE = Orthopedic_510K_Clearances_1976_to_Present.xlsx
STARTING_SET_SHEET = 510K Clearances
FDA_MASTER_FILES = FDA 510K Clearances from 1976 to 1980.txt | FDA 510K Clearances from 1981 to 1985.txt | FDA 510K Clearances from 1986 to 1990.txt | FDA 510K Clearances from 1991 to 1995.txt | FDA 510K Clearances from 1996 to Present.txt
PRODUCT_CODE_FILE = FDA Product Code Classification.txt

[expected_counts]
; Load stops if any of these differ.
STARTING_SET_ROWS = 18224
STARTING_SET_DEN = 20
STARTING_SET_BLANK_PRODUCT_CODE = 88
STARTING_SET_MIN_DATE = 1976-07-20
STARTING_SET_MAX_DATE = 2026-11-13
; STATEORSUMM by era. Format: era:value=count  (value "blank" means empty)
STATEORSUMM_BY_ERA = 1976-1990:blank=1781 | 1991-1995:Summary=534 | 1991-1995:Statement=549 | 1991-1995:blank=457 | 1996+:Summary=14373 | 1996+:Statement=336 | 1996+:blank=194
FDA_MASTER_ROWS = 176747
PRODUCT_CODE_ROWS = 7105

[payments]
; Benchmark a Vendor, Phase A: Open Payments and GUDID. Paths are relative to this folder.
OP_DIR = ../CMS Open Payments for 2025 to 2019
; Each program year sits in its own folder; {year} is filled in.
OP_YEAR_FOLDER = CMS Open Payments for {year}
OP_YEARS = 2019, 2020, 2021, 2022, 2023, 2024, 2025
; File name patterns inside each year folder. Exactly one file must match each (the removed file may be missing).
OP_GENERAL_GLOB = OP_DTL_GNRL_PGYR{year}_*.csv
OP_RESEARCH_GLOB = OP_DTL_RSRCH_PGYR{year}_*.csv
OP_OWNERSHIP_GLOB = OP_DTL_OWNRSHP_PGYR{year}_*.csv
OP_REMOVED_GLOB = OP_REMOVED_DELETED_PGYR{year}_*.csv
; Recipients kept from every payer: any specialty slot matching this (case-insensitive) regular expression.
OP_ORTHO_SPECIALTY_REGEX = orthop|podiat|neurological surgery|foot & ankle|hand surgery
; Product category or name words that mark an orthopedic product when no device ID resolves (used only to find
; orthopedic payers, never to link a payment to a product).
OP_ORTHO_PRODUCT_REGEX = spine|spinal|orthop|\bknee|\bhip\b|shoulder|elbow|wrist|trauma|extremit|\bfoot\b|ankle|sports med|arthroscop|\bjoint|arthroplast|bone graft|bone void|allograft|demineralized|orthobiologic|\bfusion|vertebr|kyphoplast
GUDID_DIR = ../GUDID Full Release as of 2026 November
GUDID_FILE_GLOB = FULLDownload_Part*_Of_*.xml
GUDID_PARTS = 211
; From the release header (numberRecordsDatabase). The index reports any difference.
GUDID_EXPECTED_RECORDS = 5258157
; Parallel workers for the GUDID index. Blank = automatic (CPU cores minus one, at most 6).
GUDID_WORKERS =
PAYMENTS_DB = data/payments.duckdb
GUDID_STAGE_DIR = data/gudid_stage
DUCKDB_TEMP_DIR = data/duckdb_tmp
; DuckDB memory cap. Lower it (for example 2GB) if the PC runs short of memory.
DUCKDB_MEMORY_LIMIT = 4GB

[fda_dashboard]
; FDA inspections, Form 483 citations and compliance actions, exported from datadashboard.fda.gov.
; Inspections page: Download Dataset > Entire Inspections Dataset, then Entire Citations Dataset.
; Compliance Actions page: Download Dataset > Entire Dataset. Save the three .xlsx files in this folder.
DIR = ../FDA Data Dashboard

[cms_add_on]
; CMS add-on payment files. From the FY 2027 IPPS final rule home page: MAC Implementation File 8 (ZIP).
; From the CY 2027 OPPS final rule page (CMS-1850-FC): "2027 FR OPPS Addenda" (ZIP). Save both ZIPs, unopened.
DIR = ../CMS Add-on Payments

[cms_asc]
; Medicare ASC payment rates. From the CY 2027 OPPS/ASC final rule page (CMS-1850-FC), Related Links:
; "2027 FR Addendum AA, BB, DD1, DD2, EE, and FF" (ZIP). Save the ZIP, unopened.
DIR = ../CMS ASC Addenda 2027
RATE_YEAR = 2027

[medicare]
; Medicare reimbursement view: CMS Medicare Inpatient and Outpatient Hospitals by Provider and Service.
; Download both from data.cms.gov. Paths are relative to this folder.
DATA_YEAR = 2024
IP_FILE = ../Medicare Inpatient Hospitals by Provider and Service 2024/Medicare_IP_Hospitals_by_Provider_and_Service_2024.csv
OP_FILE = ../Medicare Outpatient Hospitals by Provider and Service 2024/Medicare_OP_Hospitals_by_Provider_and_Service_2024.csv
; Load stops if any of these differ.
IP_EXPECTED_ROWS = 145879
IP_EXPECTED_HOSPITALS = 2906
OP_EXPECTED_ROWS = 116182
OP_EXPECTED_HOSPITALS = 3126
; CMS hides any hospital and DRG (or APC) with fewer than this many cases. The load checks no row falls below it.
SUPPRESSION_MIN = 11
; Outpatient payment groups kept for the site (case-insensitive regular expression on the APC description).
OP_APC_REGEX = musculoskeletal procedures
; Shares of payment for the supply-cost range (comma separated fractions). Applies only to families with
; supply_range = yes in reference/procedure_families.csv (families with a published implant-cost study).
SUPPLY_SHARES = 0.30, 0.40, 0.50
; A DRG shows the spread of hospital averages (25th percentile, median, 75th) only when at least this many hospitals report it.
SPREAD_MIN_HOSPITALS = 5
; Vendors count as active in a device category with a 510(k) decided in this many years before the data end date.
ACTIVE_VENDOR_YEARS = 5
