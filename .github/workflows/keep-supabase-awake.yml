# Keeps the Supabase Free plan project from pausing. Supabase pauses a Free project when it sees too little
# database activity over 7 days, so this job runs one real read-only query twice a week: pc_vendor_coverage(),
# the same call the home page makes for its counts. It changes nothing in the database.
#
# Setup (once): GitHub repo > Settings > Secrets and variables > Actions > New repository secret:
#   SUPABASE_URL              https://<project-ref>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  the sb_publishable_... key the website uses (never the service_role key)
# Run it by hand anytime from the Actions tab: Keep Supabase awake > Run workflow.
# If every try fails, the job fails and GitHub emails you: open the Supabase dashboard and check the project.

name: Keep Supabase awake

on:
  schedule:
    - cron: "17 15 * * 1,4"   # Mondays and Thursdays, 15:17 UTC (8:17 am in Arizona)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the database once
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -u
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets first."
            exit 1
          fi
          for attempt in 1 2 3; do
            code=$(curl -sS -o body.json -w '%{http_code}' --max-time 60 -X POST \
              "${SUPABASE_URL%/}/rest/v1/rpc/pc_vendor_coverage" \
              -H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Content-Type: application/json" -d '{}') || code=000
            if [ "$code" = "200" ]; then
              echo "Database answered on try ${attempt}:"
              cat body.json
              echo
              exit 0
            fi
            echo "Try ${attempt} got HTTP ${code}."
            sleep 60
          done
          echo "::error::Supabase didn't answer after 3 tries. Open the Supabase dashboard and check whether the project is paused."
          exit 1
